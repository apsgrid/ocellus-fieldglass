name: Bug report
description: Report a reproducible Fieldglass problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Android companion
        - Display/touch
        - Wi-Fi
        - BLE
        - Storage
        - Battery/power
        - Build/CI
        - Documentation
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Exact CYD/board model and attached modules
      placeholder: E32R40T 4-inch ESP32 CYD
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fieldglass version
      placeholder: 0.3.0-companion
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include STATUS/reset/serial information if useful. Remove private radio/location data first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, private coordinates and unnecessary radio identifiers from logs.
          required: true