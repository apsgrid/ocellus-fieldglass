name: Fieldglass firmware

on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run protocol/schema tests
        run: |
          python sim/generate_sample.py
          python tests/test_sample.py
          python tests/test_companion_protocol.py

      - name: Build firmware
        run: pio run

      - uses: actions/upload-artifact@v4
        with:
          name: fieldglass-firmware
          path: |
            .pio/build/cyd4/firmware.bin
            .pio/build/cyd4/bootloader.bin
            .pio/build/cyd4/partitions.bin